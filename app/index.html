<title>Global Investment Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5,500;87.5,600;87.5,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an operator's desk. Sticky masthead with the week's verdict, tab rail, one working surface per tab;
   detail opens in a side sheet (full-screen on phones). Data is read from data.json beside this page. */
:root{
  --bg:#eef2f1; --panel:#ffffff; --sunk:#f6f8f8; --ink:#13201e; --muted:#5a6966; --rule:#d3dcda; --rule-soft:#e5ebe9;
  --accent:#0d6b62; --accent-ink:#ffffff; --accent-soft:#dcefec;
  --up:#1b7a49; --down:#b1362e; --warn:#9a6700; --info:#2f5f9e;
  --up-soft:#e2f2e8; --down-soft:#f8e3e1; --warn-soft:#f8eed8; --info-soft:#e3ebf7;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px; --shadow:0 1px 2px rgb(19 32 30 / .06),0 8px 24px rgb(19 32 30 / .06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1312; --panel:#131d1b; --sunk:#0f1817; --ink:#e1ebe8; --muted:#93a5a0; --rule:#26332f; --rule-soft:#1d2826;
  --accent:#4cb5a8; --accent-ink:#06201d; --accent-soft:#16312d;
  --up:#4cc283; --down:#ef7a70; --warn:#e2b04a; --info:#7fa8e6;
  --up-soft:#132b1f; --down-soft:#341a18; --warn-soft:#30260f; --info-soft:#17233a;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1312; --panel:#131d1b; --sunk:#0f1817; --ink:#e1ebe8; --muted:#93a5a0; --rule:#26332f; --rule-soft:#1d2826;
  --accent:#4cb5a8; --accent-ink:#06201d; --accent-soft:#16312d;
  --up:#4cc283; --down:#ef7a70; --warn:#e2b04a; --info:#7fa8e6;
  --up-soft:#132b1f; --down-soft:#341a18; --warn-soft:#30260f; --info-soft:#17233a;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--f-display);font-stretch:87.5%;text-wrap:balance;margin:0;letter-spacing:.005em}
h2{font-size:1.25rem;font-weight:600}
h3{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.num,td.n,.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.small{font-size:.85rem}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--rule)}
.mast .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:1.35rem;font-weight:700}
.brand .asof{font:500 .78rem var(--f-data);color:var(--muted);white-space:nowrap}
.mast .spacer{flex:1}
.verdict{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--rule-soft)}
.tabs::-webkit-scrollbar{display:none}
.tabs .wrap{display:flex;gap:2px;padding-block:0}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:600 .9rem var(--f-display);font-stretch:87.5%;letter-spacing:.02em;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}

main{padding-block:22px 64px}
.view{display:grid;gap:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px;align-items:start}
.grid2>*,.grid3>*{min-width:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px;align-content:start;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* Chips and pills */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font:600 .74rem var(--f-body);letter-spacing:.02em;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--rule)}
.chip.up{background:var(--up-soft);color:var(--up);border-color:transparent}
.chip.down{background:var(--down-soft);color:var(--down);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* Buttons */
.btn{appearance:none;border:1px solid var(--rule);background:var(--panel);border-radius:5px;padding:7px 12px;font-weight:600;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Verdict banner */
.banner{border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;border:1px solid var(--rule);background:var(--panel)}
.banner.low{border-left:4px solid var(--warn)}
.banner.ok{border-left:4px solid var(--up)}
.banner .lead{font:600 1.08rem/1.35 var(--f-display);font-stretch:87.5%}

/* Market tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;min-width:0}
.tile .k{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile .big{font:500 1.3rem var(--f-data);font-variant-numeric:tabular-nums}
.tile .sub{font-size:.8rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
svg.spark{display:block;width:100%;height:30px}
svg.spark .ln{fill:none;stroke-width:1.6}
svg.spark .ar{opacity:.14}

/* Lists */
.list{display:grid;gap:0;margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--rule-soft);align-items:start}
.list li:last-child{border-bottom:0}
.list .t{font-weight:600}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font:600 .7rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);background:var(--sunk);white-space:nowrap;position:sticky;top:0}
th.n,td.n{text-align:right}
td{padding:8px 10px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td .nm{display:block;font-size:.78rem;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.sp{width:110px;min-width:100px}
.pos{color:var(--up)} .neg{color:var(--down)}

/* Toolbars */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden;background:var(--panel)}
.seg button{appearance:none;border:0;background:none;padding:6px 11px;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--muted);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.field{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.input,select.input,textarea.input{border:1px solid var(--rule);background:var(--panel);border-radius:5px;padding:7px 10px;min-width:0;width:100%;color:var(--ink)}
.input.num{font-family:var(--f-data)}
.pv{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.pv input{width:150px}

/* Sheet (detail) */
.scrim{position:fixed;inset:0;background:rgb(8 14 13 / .38);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);z-index:41;box-shadow:var(--shadow);border-left:1px solid var(--rule);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--rule)}
.sheet .bd{overflow-y:auto;padding:18px 20px 32px;display:grid;gap:18px;align-content:start}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kv div{background:var(--sunk);border-radius:5px;padding:8px 10px;display:grid;gap:2px}
.kv span{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv b{font:500 1rem var(--f-data);font-variant-numeric:tabular-nums}
svg.ladder{width:100%;height:auto;aspect-ratio:500/160;display:block;flex-shrink:0}
svg.ladder text{fill:var(--muted);font:11px var(--f-data)}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:5px;background:var(--sunk);font-size:.9rem}
.flag.crit{background:var(--down-soft);color:var(--down)}
.flag.warn{background:var(--warn-soft);color:var(--warn)}
.flag.good{background:var(--up-soft);color:var(--up)}
.flag.info{background:var(--info-soft);color:var(--info)}
.flag b{color:inherit}

/* Claude output */
.answer{background:var(--sunk);border:1px solid var(--rule-soft);border-radius:5px;padding:12px 14px;font-size:.92rem;display:grid;gap:8px;max-height:none}
.answer h4{font:600 .82rem var(--f-display);font-stretch:87.5%;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:6px 0 0}
.answer ul,.answer ol{margin:0;padding-left:20px;display:grid;gap:3px}
.answer p{margin:0}
.thinking{color:var(--muted);font-style:italic}

/* Options */
.opt{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.opt .ttl{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.opt .ttl b{font:600 1.05rem var(--f-display);font-stretch:87.5%}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:64px}
.bars div{display:grid;gap:3px;justify-items:center;font:10px var(--f-data);color:var(--muted);height:100%;grid-template-rows:1fr auto}
.bars i{display:block;width:100%;border-radius:2px;align-self:end}

/* Evidence */
svg.curve{width:100%;height:auto;aspect-ratio:760/240;display:block}
svg.curve text{fill:var(--muted);font:11px var(--f-data)}
svg.curve .g{stroke:var(--rule-soft)}
.heat td.n{font-size:.8rem}

/* Journal */
.jform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.jform .wide{grid-column:1/-1}
.empty{border:1px dashed var(--rule);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:grid;gap:6px;justify-items:center}
.note{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:5px;font-size:.88rem;z-index:60;box-shadow:var(--shadow)}
.progress{height:3px;background:var(--rule-soft);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
footer.foot{font-size:.78rem;color:var(--muted);padding-block:0 40px}
@media (max-width:640px){
  .wrap{padding-inline:16px}
  .brand h1{font-size:1.15rem}
  .pv input{width:120px}
  .sheet{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="mast">
  <div class="wrap">
    <div class="brand"><h1>Global Investment Desk</h1><span class="asof" id="asof">loading…</span></div>
    <div class="spacer"></div>
    <div class="verdict" id="verdict"></div>
  </div>
  <nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist" id="tablist"></div></nav>
</header>

<main class="wrap" id="main">
  <section class="view" id="v-today" role="tabpanel"></section>
  <section class="view" id="v-decisions" role="tabpanel" hidden></section>
  <section class="view" id="v-income" role="tabpanel" hidden></section>
  <section class="view" id="v-options" role="tabpanel" hidden></section>
  <section class="view" id="v-evidence" role="tabpanel" hidden></section>
  <section class="view" id="v-journal" role="tabpanel" hidden></section>
</main>
<footer class="wrap foot" id="foot">Rule-based research from Interactive Brokers weekly closes. Not personalised advice. Re-price live before trading.</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheet-title"></aside>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, signed = true, dp = 1) => x == null || isNaN(x) ? "—" : (signed && x > 0 ? "+" : "") + (x * 100).toFixed(dp) + "%";
const num = (x, dp = 2) => x == null || isNaN(x) ? "—" : Number(x).toLocaleString("en-GB", {minimumFractionDigits: dp, maximumFractionDigits: dp});
const px = x => x == null ? "—" : num(x, x >= 1000 ? 1 : x >= 10 ? 2 : x >= 1 ? 3 : 4);
const cls = x => x == null ? "" : x > 0 ? "pos" : x < 0 ? "neg" : "";
const store = {get(k, d) { try { const v = localStorage.getItem("gid." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
               set(k, v) { try { localStorage.setItem("gid." + k, JSON.stringify(v)); } catch {} }};
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }

const STANCE = {Accumulate: "up", Hold: "acc", Watch: "warn", Avoid: "down"};
const stanceChip = s => `<span class="chip ${STANCE[s] || ""}">${esc(s)}</span>`;
const trendChip = t => t ? `<span class="chip ${t === "up" ? "up" : t === "down" ? "down" : ""}">${esc(t)}</span>` : "";
const IBKR = "Interactive Brokers IBKR";

let D = null;                 // this week's data
const live = {};              // symbol -> {price, chg, status, at}
let journal = [];             // entries from db
const S = {tab: "today", stance: store.get("stance", "Accumulate"), market: store.get("market", "All"), q: "",
           pv: store.get("pv", null), half: null, sort: store.get("sort", "stance")};

/* ---------- small charts ---------- */
function spark(arr, color) {
  if (!arr || arr.length < 2) return "";
  const w = 120, h = 30, lo = Math.min(...arr), hi = Math.max(...arr), r = (hi - lo) || 1;
  const pts = arr.map((v, i) => [i * (w - 4) / (arr.length - 1) + 2, h - 3 - (v - lo) / r * (h - 6)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join("");
  const c = color || (arr[arr.length - 1] >= arr[0] ? "var(--up)" : "var(--down)");
  const [ex, ey] = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path class="ar" d="${d}L${w - 2},${h}L2,${h}Z" fill="${c}"/><path class="ln" d="${d}" stroke="${c}"/><circle cx="${ex}" cy="${ey}" r="2.2" fill="${c}"/></svg>`;
}

/* ---------- money ---------- */
function usdPer(ccy) {
  const o = Object.fromEntries((D.others || []).map(x => [x.symbol, x.last]));
  return {USD: 1, GBP: o["GBP.USD"], EUR: o["EUR.USD"], SGD: o["USD.SGD"] && 1 / o["USD.SGD"], HKD: o["USD.HKD"] && 1 / o["USD.HKD"],
          CNH: o["USD.CNH"] && 1 / o["USD.CNH"], JPY: o["USD.JPY"] && 1 / o["USD.JPY"], CHF: o["USD.CHF"] && 1 / o["USD.CHF"]}[ccy];
}
function tradeCcy(c) {
  const k = c.contract || {};
  if (k.currency) return k.currency;
  if (["SEHKNTL", "SEHKSZSE", "CHINEXT"].includes(k.exchange)) return "CNH";
  if (k.exchange === "SEHK") return "HKD";
  return null;
}
const pv = () => S.pv ?? 1000000;
const halfOn = () => S.half ?? (D.evidence?.level === "LOW");
function sizing(c) {
  if (!c.size) return null;
  const w = c.size * (halfOn() ? 0.5 : 1);
  const value = pv() * w;
  const price = live[c.symbol]?.price ?? c.last;
  const ccy = tradeCcy(c), rate = ccy && usdPer(ccy);
  const shares = rate ? Math.floor(value / (price * rate)) : null;
  return {w, value, shares, ccy, risk: c.stop_distance != null ? value * c.stop_distance : null, price};
}

/* ---------- capabilities ---------- */
const cap = {mcp: null, sample: null, db: null, user: null, downloads: null, canWrite: null};
async function boot() {
  try {
    const r = await fetch("data.json", {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    D = await r.json();
  } catch (e) {
    $("#main").innerHTML = `<div class="empty"><b>This week's data did not load.</b><span>Reload the page. If it keeps failing, the weekly refresh may not have published data.json yet.</span></div>`;
    $("#asof").textContent = "no data";
    return;
  }
  S.half = store.get("half", null);
  renderChrome();
  const start = (location.hash || "").slice(1);
  show(TABS.some(t => t.id === start) ? start : store.get("tab", "today"));
  if (window.claude?.use) {
    claude.use("mcp").then(m => { cap.mcp = m; rerender(); });
    claude.use("sample").then(s => { cap.sample = s; rerender(); });
    claude.use("downloads").then(d => { cap.downloads = d; });
    claude.use("user").then(async u => { cap.user = u; cap.canWrite = u ? await u.can("data.write").catch(() => null) : null; rerender(); });
    claude.use("db").then(db => { cap.db = db; if (db) subscribeJournal(); else rerender(); });
  }
}

/* ---------- live quotes (read-only IBKR) ---------- */
const MCP_FIX = {
  server_not_connected: "Add Interactive Brokers in claude.ai Settings → Connectors to see live prices.",
  needs_reauth: "Reconnect Interactive Brokers in claude.ai Settings → Connectors.",
  selection_required: "Choose which Interactive Brokers connection this page should use when claude.ai asks.",
  not_in_manifest: "Live prices are switched off for this page. Turn on Interactive Brokers in this page's Permissions menu.",
  blocked_by_policy: "Your organisation's policy blocks live prices from Interactive Brokers here.",
  approval_required: "Live prices need your approval. Press the button again and allow the request.",
  not_granted: "Live prices are not available in this view.", capability_disabled: "Live prices are not available in this view.",
};
const mcpMsg = e => MCP_FIX[e?.code] || (e?.code === "tool_error" ? "Interactive Brokers answered with an error: " + (e.message || "no detail") : "Interactive Brokers did not answer. Try again in a minute.");
async function quote(c, attempt = 0) {
  const k = c.contract;
  if (!cap.mcp || !k?.id) throw {code: "not_granted"};
  const input = {contract_id: k.id, market_data_names: ["last", "prior_close", "change", "top_status"]};
  if (!(k.currency === "USD" && k.sectype === "STK")) input.exchange = k.exchange;
  try {
    const res = await cap.mcp.callTool(IBKR, "get_price_snapshot", input, {cache: {staleTime: 60000, gcTime: 300000}});
    const p = res.payload || {};
    const raw = p.last?.price ?? p["prior-close"]?.priorClose;
    if (raw == null) throw {code: "tool_error", message: "no price in the reply (market closed and no prior close)"};
    const q = {price: raw / (k.live_divisor || 1), chg: p.change?.change_pct != null ? p.change.change_pct / 100 : null,
               status: p["top-status"]?.status || "", at: res.cache?.storedAt || Date.now()};
    live[c.symbol] = q;
    return q;
  } catch (e) {
    if (e?.retryable && attempt === 0 && !["tool_error"].includes(e.code)) {
      await new Promise(r => setTimeout(r, Math.min(e.retryAfterMs || 1500, 8000) + Math.random() * 600));
      return quote(c, 1);
    }
    throw e;
  }
}
function flagsFor(c) {
  const q = live[c.symbol]; if (!q) return [];
  const p = q.price, out = [];
  if (c.stop != null && p < c.stop) out.push(["crit", `Below the exit level ${px(c.stop)}. The plan says sell or cut.`]);
  if (c.entry && c.stance === "Accumulate") {
    if (p >= c.entry[0] && p <= c.entry[1]) out.push(["good", `Inside the buy zone ${px(c.entry[0])}–${px(c.entry[1])}.`]);
    else if (p > c.entry[1]) out.push(["warn", `Above the buy zone (${px(c.entry[1])}). Wait for a pullback rather than chase.`]);
    else if (c.stop == null || p >= c.stop) out.push(["info", `Below the buy zone but above the exit: re-check the trend before adding.`]);
  }
  if (c.trigger != null && (c.stance === "Watch" || c.stance === "Avoid") && p > c.trigger) out.push(["info", `Back above the revisit trigger ${px(c.trigger)}. Re-check this week.`]);
  if (c.vol && c.last) {
    const z = (p / c.last - 1) / (c.vol / Math.sqrt(52));
    if (Math.abs(z) >= 2.5) out.push([Math.abs(z) >= 4 ? "crit" : "warn", `Moved ${pct(p / c.last - 1)} since the weekly close: ${Math.abs(z).toFixed(1)} weekly standard deviations.`]);
  }
  return out;
}

let checking = false;
async function liveCheck(list, onDone) {
  if (checking) return; checking = true;
  const bar = $("#lc-bar"), msg = $("#lc-msg");
  let ok = 0, fail = null;
  for (let i = 0; i < list.length; i++) {
    if (msg) msg.textContent = `Pricing ${list[i].symbol} (${i + 1} of ${list.length})…`;
    try { await quote(list[i]); ok++; }
    catch (e) {
      fail = e;
      if (!["server_unavailable", "tool_error", "upstream_error", "rate_limited"].includes(e?.code)) break; // fix needs the viewer
    }
    if (bar) bar.style.width = ((i + 1) / list.length * 100) + "%";
    if (i < list.length - 1) await new Promise(r => setTimeout(r, 2200)); // stay under IBKR's ~30 requests a minute
  }
  checking = false;
  if (msg) msg.textContent = fail && !ok ? mcpMsg(fail) : `${ok} of ${list.length} priced` + (fail ? `; some failed: ${mcpMsg(fail)}` : ".");
  onDone && onDone();
  rerender();
}

/* ---------- Claude ---------- */
function md(text) {
  const lines = esc(text).split(/\n/); let html = "", list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const l = raw.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    let m;
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { close(); html += `<h4>${m[1]}</h4>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${m[1]}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${m[1]}</li>`; }
    else if (l.trim()) { close(); html += `<p>${l}</p>`; }
  }
  close(); return html;
}

  prompt_too_large: "The question plus this week's data is too long. Ask something narrower.", refused: "Claude declined this one.",
  session_expired: "Your session expired. Reload the page.", sampling_disabled: "Asking Claude is turned off for your account.", cancelled: "Stopped."};
async function ask(prompt, out, btn) {
  if (!cap.sample) return;
  const ctl = new AbortController();
  out.hidden = false; out.innerHTML = `<p class="thinking">Thinking… this can take up to a minute.</p>`;
  const stop = document.createElement("button"); stop.className = "btn ghost small"; stop.textContent = "Stop";
  stop.onclick = () => ctl.abort(); out.append(stop);
  if (btn) btn.disabled = true;
  try {

    out.innerHTML = md(text);

    out.innerHTML = (e.text ? md(e.text) : "") + `<p class="mut">${esc(SAMPLE_FIX[e.code] || "Claude could not answer just now. Try again.")}</p>`;
  } finally { if (btn) btn.disabled = false; }
}

function ladder(c) {
  const q = live[c.symbol];
  const pts = [["Exit", c.stop, "var(--down)"], ["Buy low", c.entry?.[0], "var(--up)"], ["Buy high", c.entry?.[1], "var(--up)"],
               ["Trigger", c.trigger, "var(--info)"], ["Weekly close", c.last, "var(--ink)"], ["Live", q?.price, "var(--accent)"]].filter(p => p[1] != null);
  const lo = Math.min(...pts.map(p => p[1]), ...c.spark) * 0.985, hi = Math.max(...pts.map(p => p[1]), ...c.spark) * 1.015;
  const W = 500, H = 150, x0 = 8, x1 = 330;
  const y = v => 10 + (hi - v) / (hi - lo) * (H - 20);
  const path = c.spark.map((v, i) => (i ? "L" : "M") + (x0 + i * (x1 - x0) / (c.spark.length - 1)).toFixed(1) + "," + y(v).toFixed(1)).join("");
  const zone = c.entry ? `<rect x="${x0}" width="${x1 - x0}" y="${y(c.entry[1])}" height="${Math.max(1, y(c.entry[0]) - y(c.entry[1]))}" fill="var(--up)" opacity=".1"/>` : "";
  // spread labels so they never overlap
  const lab = pts.map(p => ({p, yy: y(p[1])})).sort((a, b) => a.yy - b.yy);
  for (let i = 1; i < lab.length; i++) if (lab[i].yy - lab[i - 1].yy < 13) lab[i].yy = lab[i - 1].yy + 13;
  return `<svg class="ladder" viewBox="0 0 ${W} ${H + 10}" role="img" aria-label="Price over 52 weeks against the plan's levels">${zone}
    <path d="${path}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
    ${pts.map(p => `<line x1="${x0}" x2="${x1 + 6}" y1="${y(p[1])}" y2="${y(p[1])}" stroke="${p[2]}" stroke-width="${p[0] === "Live" ? 2 : 1}" stroke-dasharray="${p[0] === "Weekly close" || p[0] === "Live" ? "" : "4 3"}"/>`).join("")}

      ${c.spark?.length ? ladder(c) : ""}
      <div class="row">${cap.mcp ? `<button class="btn" id="sh-live">Get live price</button>` : ""}<span class="small mut" id="sh-live-msg">${q ? "Priced " + new Date(q.at).toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"}) : ""}</span></div>
      ${s ? `<div class="panel" style="background:var(--sunk)"><header><h3>Position size</h3><span class="small mut">Portfolio ${num(pv(), 0)} USD${S.pv == null ? " (example)" : ""}${halfOn() ? " · half size" : ""} · change on the Decisions tab</span></header>
        <div class="kv"><div><span>Weight</span><b>${pct(s.w, false)}</b></div><div><span>Value (USD)</span><b>${num(s.value, 0)}</b></div>
        <div><span>Shares</span><b>${s.shares != null ? num(s.shares, 0) : "—"}</b></div><div><span>Loss at exit</span><b class="neg">${s.risk != null ? num(s.risk, 0) : "—"}</b></div></div>
        <p class="note">Shares at ${px(s.price)} ${esc(s.ccy || "")}${s.ccy && s.ccy !== "USD" ? " converted at this week's FX close" : ""}. Loss at exit assumes the exit fills at the level; gaps can make it worse.</p></div>` : ""}
      ${c.income ? `<div class="panel" style="background:var(--sunk)"><header><h3>Income</h3>${stanceChip(c.income.stance)}</header>
        <div class="kv"><div><span>Trailing yield</span><b>${pct(c.income.yield, false, 2)}</b></div><div><span>Yield at 6%</span><b>${px(c.income.price_for_6pct)}</b></div>
        <div><span>Yield at 7%</span><b>${px(c.income.price_for_7pct)}</b></div><div><span>Yield at 8%</span><b>${px(c.income.price_for_8pct)}</b></div></div><p class="note">${esc(c.income.rule)}</p></div>` : ""}
      <div class="panel"><header><h3>Challenge this position</h3><span class="mut small">Strict decision mode</span></header>
        ${cap.sample ? `<p class="small mut">Assumptions, blind spots, five fatal flaws, a pre-mortem, investor questions and one next step, from this week's data only.</p><div class="row"><button class="btn primary" id="sh-ch">Challenge ${esc(c.symbol)}</button></div><div class="answer" id="sh-ch-out" hidden></div>`
          : `<p class="small mut">Available when this page is opened in Claude.</p>`}</div>
      <div class="row"><button class="btn" id="sh-log">Log a decision on ${esc(c.symbol)}</button></div>
    </div>`;
  $("#scrim").hidden = false; sh.hidden = false; $("#sh-x").focus();
  $("#sh-x").onclick = closeSheet;
  const lb = $("#sh-live"); if (lb) lb.onclick = async () => { lb.disabled = true; $("#sh-live-msg").textContent = "Asking Interactive Brokers…";
    try { await quote(c); openCall(sym); rerenderBehind(); } catch (e) { $("#sh-live-msg").textContent = mcpMsg(e); lb.disabled = false; } };
  const ch = $("#sh-ch"); if (ch) ch.onclick = () => ask(challengePrompt(c), $("#sh-ch-out"), ch);
  $("#sh-log").onclick = () => { closeSheet(); S.prefill = c.symbol; show("journal"); };
}
function rerenderBehind() { const keep = S.tab; ({today: rToday, decisions: rDecisions, income: rIncome, journal: rJournal})[keep]?.(); }
function closeSheet() { $("#sheet").hidden = true; $("#scrim").hidden = true; }
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

/* ---------- SG income ---------- */
function rIncome() {
  const rows = D.calls.filter(c => c.income).sort((a, b) => b.income.yield - a.income.yield);
  const inBand = rows.filter(c => c.income.yield >= 0.06 && c.income.yield <= 0.08);
  $("#v-income").innerHTML = `
    <div class="banner ok"><p class="lead">${inBand.length} Singapore names yield 6–8% on trailing distributions.</p>
      <p class="mut small">Yield is cash paid over the last year divided by the weekly close. A live price recomputes it. The plan buys in thirds: now, at the 7% price, and after the price trend repairs.</p></div>
    <div class="row">${cap.mcp ? `<button class="btn" id="inc-live">Price these live</button><span class="small mut" id="lc-msg"></span>` : ""}</div>
    <div class="progress"><i id="lc-bar"></i></div>
    <div class="tw"><table><thead><tr><th>Name</th><th>Income call</th><th>Price call</th><th class="n">Price</th><th class="n">Yield</th><th class="n">Add at 7%</th><th class="n">6% / 8% price</th><th class="n">Yield if paid 20% less</th><th>Basis</th></tr></thead>
    <tbody>${rows.map(c => { const q = live[c.symbol], p = q?.price ?? c.last, y = c.income.yield * c.last / p;
      return `<tr class="click" data-sym="${esc(c.symbol)}" tabindex="0"><td><b class="mono">${esc(c.symbol)}</b><span class="nm">${esc(c.name)}</span></td><td>${stanceChip(c.income.stance)}</td><td>${stanceChip(c.stance)}</td>
      <td class="n">${px(p)}${q ? `<span class="nm">live</span>` : ""}</td><td class="n"><b>${pct(y, false, 2)}</b>${y >= 0.06 && y <= 0.08 ? ` <span class="chip up">in band</span>` : ""}</td>
      <td class="n">${px(c.income.price_for_7pct)}</td><td class="n">${px(c.income.price_for_6pct)} / ${px(c.income.price_for_8pct)}</td>
      <td class="n">${pct(c.income.yield_after_cut?.["20%"], false, 2)}</td><td class="small mut">${esc(c.income.basis || "")}</td></tr>`; }).join("")}</tbody></table></div>
    <p class="note">One year of distributions only: a single special dividend can inflate the yield. Check the payout history before buying.</p>`;
  const b = $("#inc-live"); if (b) b.onclick = () => liveCheck(rows);
  document.querySelectorAll("#v-income tr[data-sym]").forEach(tr => { tr.onclick = () => openCall(tr.dataset.sym); tr.onkeydown = e => { if (e.key === "Enter") openCall(tr.dataset.sym); }; });
}

/* ---------- Options ---------- */
function rOptions() {
  const o = D.options;
  if (!o) { $("#v-options").innerHTML = `<div class="empty">No option chains were collected this week.</div>`; return; }
  const pol = o.policy, budget = pv() * pol.per_trade;
  const maxBar = Math.max(...o.ideas.flatMap(i => Object.values(i.scenarios || {}).map(Math.abs)), 1);
  $("#v-options").innerHTML = `
    <div class="banner low"><p class="lead">Speculative sleeve: at most ${pct(pol.sleeve_cap, false, 0)} of the portfolio, ${pct(pol.per_trade, false, 0)} per trade, defined risk only.</p>
      <p class="mut small">Take profit at +${Math.round(pol.take_profit * 100)}%, cut at −${Math.round(pol.stop_loss * 100)}%, and close after ${pol.time_stop_days} days if nothing has happened. Prices are last week's mids: re-price before trading.</p></div>
    <div class="toolbar">${pvControl()}<span class="note">Per-trade budget ${num(budget, 0)} USD</span></div>
    <div class="grid3">${o.ideas.map(i => { const n = Math.floor(budget / i.debit_per_contract);
      return `<article class="opt"><div class="ttl"><b>${esc(i.symbol)} ${esc(i.structure)}</b><span class="chip ${i.direction === "bull" ? "up" : "down"}">${esc(i.direction)}</span></div>
        <div class="mono small">${i.legs.map(l => `${l.qty > 0 ? "Buy" : "Sell"} ${l.strike}${l.right}`).join(" / ")} · ${esc(i.expiry)} (${i.days}d)</div>
        <div class="kv"><div><span>Cost / contract</span><b>${num(i.debit_per_contract, 0)}</b></div><div><span>Contracts at ${pct(pol.per_trade, false, 0)}</span><b>${n}</b></div>
          <div><span>Breakeven move</span><b>${pct(i.breakeven_move)}</b></div><div><span>Prob. of profit</span><b>${Math.round(i.prob_profit * 100)}%</b></div>
          <div><span>Reward : risk</span><b>${i.reward_risk == null ? "open" : num(i.reward_risk, 1) + " : 1"}</b></div><div><span>Return at 1σ</span><b class="${cls(i.return_at_1sd)}">${pct(i.return_at_1sd, true, 0)}</b></div></div>
        <div class="bars" aria-label="Return on premium if the underlying moves">${Object.entries(i.scenarios || {}).map(([k, v]) => `<div><i style="height:${Math.max(3, Math.abs(v) / maxBar * 100)}%;background:var(--${v >= 0 ? "up" : "down"})" title="${esc(k)}: ${pct(v, true, 0)}"></i><span>${esc(k)}</span></div>`).join("")}</div>
        <p class="note">Bars: return on the premium at expiry if ${esc(i.symbol)} moves by the amount shown. The stock's own call is ${esc(i.stance)}.</p></article>`; }).join("")}</div>`;
  bindPv();
}

/* ---------- Evidence ---------- */
function rEvidence() {
  const e = D.evidence;
  if (!e) { $("#v-evidence").innerHTML = `<div class="empty">No backtest this week.</div>`; return; }
  const c = e.curve, W = 760, H = 240, all = [...c.strategy, ...c.benchmark], lo = Math.min(...all), hi = Math.max(...all);
  const X = i => 46 + i * (W - 60) / (c.dates.length - 1), Y = v => 12 + (hi - v) / (hi - lo) * (H - 44);
  const path = a => a.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1)).join("");
  const ticks = [lo, 1, (lo + hi) / 2, hi].filter((v, i, a) => v >= lo && v <= hi && a.indexOf(v) === i).sort((a, b) => a - b);
  const years = c.dates.map((d, i) => [d.slice(0, 4), i]).filter(([y], i, a) => i === 0 || y !== a[i - 1][0]).filter(([y]) => +y % 3 === 2);
  const variants = e.variants || [], bench = variants.find(v => v.variant.startsWith("Benchmark")), rules = variants.filter(v => v !== bench);
  const short = v => v.variant.split(" (")[0].split(":")[0];
  const yrs = bench ? Object.keys(bench.years).sort() : [];
  const heat = v => v == null ? "" : `background:color-mix(in srgb, var(--${v >= 0 ? "up" : "down"}) ${Math.min(55, Math.abs(v) * 160).toFixed(0)}%, transparent)`;
  $("#v-evidence").innerHTML = `
    <div class="banner ${e.level === "LOW" ? "low" : "ok"}"><p class="lead">Rule confidence ${esc(e.level)}: ${e.level === "LOW" ? "following the calls has not beaten holding everything equally." : "the rules have beaten holding everything equally."}</p>
      <p class="mut small">${e.instruments} instruments, ${num(e.observations, 0)} weekly observations, ${esc(e.first_date)} to ${esc(e.last_date)}. Walk-forward: each week's call uses only data available that week.</p></div>
    <div class="tiles">
      <div class="tile"><h3>Rule return a year</h3><div class="big">${pct(e.strategy.cagr)}</div><div class="sub">Equal weight ${pct(e.benchmark.cagr)}</div></div>
      <div class="tile"><h3>Sharpe ratio</h3><div class="big">${num(e.strategy.sharpe, 2)}</div><div class="sub">Equal weight ${num(e.benchmark.sharpe, 2)}</div></div>
      <div class="tile"><h3>Worst fall</h3><div class="big neg">${pct(e.strategy.max_drawdown)}</div><div class="sub">Equal weight ${pct(e.benchmark.max_drawdown)}</div></div>
      <div class="tile"><h3>Time invested</h3><div class="big">${pct(e.avg_invested, false, 0)}</div><div class="sub">Cash earns 0% in the test</div></div></div>
    <div class="panel"><header><h2>Growth of 1 unit</h2><span class="small mut"><span style="color:var(--accent)">━</span> current rule &nbsp; <span style="color:var(--muted)">┅</span> equal weight</span></header>
      <svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="Growth of one unit: current rule against equal weight">
        ${ticks.map(v => `<line class="g" x1="46" x2="${W - 10}" y1="${Y(v)}" y2="${Y(v)}"/><text x="4" y="${Y(v) + 4}">${v.toFixed(2)}</text>`).join("")}
        ${years.map(([y, i]) => `<text x="${X(i) - 14}" y="${H - 8}">${y}</text>`).join("")}
        <path d="${path(c.benchmark)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <path d="${path(c.strategy)}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg></div>
    <div class="panel"><header><h2>Alternative rules</h2><span class="small mut">Adopt only if: better Sharpe in both halves and all three thirds, active t ≥ 2</span></header>
      <div class="tw"><table><thead><tr><th>Rule</th><th class="n">A year</th><th class="n">Sharpe</th><th class="n">Worst fall</th><th class="n">Invested</th><th class="n">Names held</th><th class="n">Thirds won</th><th class="n">Active t</th><th>Adopt</th></tr></thead>
      <tbody>${variants.map(v => `<tr><td><b>${esc(short(v))}</b><span class="nm">${esc(v.variant.includes("(") ? v.variant.split(" (")[1].replace(")", "") : v.variant.split(": ")[1] || "")}</span></td>
        <td class="n ${cls(v.cagr)}">${pct(v.cagr)}</td><td class="n">${num(v.sharpe, 2)}</td><td class="n neg">${pct(v.max_drawdown)}</td><td class="n">${pct(v.invested, false, 0)}</td>
        <td class="n">${v.median_names_held == null ? "—" : num(v.median_names_held, 0)}</td><td class="n">${v.thirds_won == null ? "—" : v.thirds_won + " of 3"}</td>
        <td class="n">${v.active_t == null ? "—" : num(v.active_t, 2)}</td><td>${v.passes_adoption_test == null ? "—" : v.passes_adoption_test ? `<span class="chip up">yes</span>` : `<span class="chip down">no</span>`}</td></tr>`).join("")}</tbody></table></div></div>
    ${yrs.length ? `<div class="panel"><header><h2>Year by year</h2><span class="small mut">Shading scales with the size of the gain or loss</span></header>
      <div class="tw heat"><table><thead><tr><th>Year</th><th class="n">Equal weight</th>${rules.map(v => `<th class="n">${esc(short(v))}</th>`).join("")}</tr></thead>
      <tbody>${yrs.map(y => `<tr><td class="mono">${y}</td><td class="n" style="${heat(bench.years[y])}">${pct(bench.years[y])}</td>${rules.map(v => `<td class="n" style="${heat(v.years?.[y])}">${pct(v.years?.[y])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>` : ""}
    ${e.data_fixes?.length ? `<p class="note">${e.data_fixes.map(f => `Excluded bad print: ${esc(f.symbol)} ${esc(f.date)} closed ${f.close} between ${f.previous} and ${f.next}.`).join(" ")}</p>` : ""}
    <p class="note">Limits: today's instrument list (survivorship), price returns in local currency, weekly closes, no costs, taxes or dividends, no macro overlay.</p>`;
}

/* ---------- Journal (shared db) ---------- */
let jUnsub = null, jState = "loading";
function subscribeJournal() {
  if (jUnsub || !cap.db) return;
  try {
    jUnsub = cap.db.collection("journal").orderBy("created", "desc").limit(300).onSnapshot(snap => {
      journal = snap.docs.map(d => ({id: d.id, ...d.data()})); jState = "ready"; if (S.tab === "journal" || S.tab === "today") rerender();
    }, err => { jState = err.code === "revoked" ? "off" : "error"; jUnsub = null; if (S.tab === "journal") rJournal(); });
  } catch { jState = "error"; }
}
const ACTIONS = ["Buy", "Add", "Hold", "Trim", "Sell", "Skip"];
function rJournal() {
  const today = new Date().toISOString().slice(0, 10);
  const canWrite = cap.db && cap.canWrite !== false;
  const pre = S.prefill ? D.calls.find(c => c.symbol === S.prefill) : null;
  const all = [...D.calls].sort((a, b) => a.symbol.localeCompare(b.symbol));
  const due = journal.filter(j => j.review_date && j.review_date <= today);
  $("#v-journal").innerHTML = `
    <div class="grid2">
      <div class="panel"><header><h2>Log a decision</h2><span class="small mut">Saved for you and the weekly review</span></header>
        ${!cap.db ? `<p class="small mut">The journal saves when this page is opened in Claude while signed in.</p>` : !canWrite ? `<p class="small mut">You can read this journal but not add to it.</p>` : `
        <form class="jform" id="jf">
          <label class="field">Instrument<select class="input" id="j-sym">${all.map(c => `<option value="${esc(c.symbol)}"${pre?.symbol === c.symbol ? " selected" : ""}>${esc(c.symbol)} · ${esc(c.name)}</option>`).join("")}</select></label>
          <label class="field">Action<select class="input" id="j-act">${ACTIONS.map(a => `<option${pre && pre.stance === "Accumulate" && a === "Buy" ? " selected" : ""}>${a}</option>`).join("")}</select></label>
          <label class="field">Price<input class="input num" id="j-px" inputmode="decimal" required value="${pre ? (live[pre.symbol]?.price ?? pre.last) : ""}"></label>
          <label class="field">Weight of portfolio (%)<input class="input num" id="j-w" inputmode="decimal" placeholder="e.g. 1.5" value="${pre && sizing(pre) ? (sizing(pre).w * 100).toFixed(2) : ""}"></label>
          <label class="field">Date<input class="input" type="date" id="j-date" value="${today}"></label>
          <label class="field">Review on<input class="input" type="date" id="j-rev" value="${new Date(Date.now() + 91 * 864e5).toISOString().slice(0, 10)}"></label>
          <label class="field wide">Why (the thesis and what would prove it wrong)<textarea class="input" id="j-why" rows="3" required placeholder="e.g. Oil up-trend intact; exit if it closes below the exit level or Brent loses its 40-week average."></textarea></label>
          <div class="row wide"><button class="btn primary" type="submit" id="j-save">Save to journal</button><span class="small mut" id="j-msg">The call, exit level and week are saved with it.</span></div>
        </form>`}
      </div>
      <div class="panel"><header><h2>Review due</h2><span class="chip ${due.length ? "warn" : ""}">${due.length}</span></header>
        ${due.length ? `<ul class="list">${due.map(j => `<li><span class="t mono">${esc(j.symbol)}</span><span>${esc(j.action)} at ${px(j.price)} on ${esc(j.date)}<br><span class="small mut">Was ${esc(j.stance_at_entry || "")}; review set for ${esc(j.review_date)}</span></span></li>`).join("")}</ul>`
          : `<p class="small mut">Nothing due. Entries come up here on their review date, and the weekly review scores them.</p>`}
      </div>
    </div>
    <div class="panel"><header><h2>Decision journal</h2><span class="small mut">${journal.length} ${journal.length === 1 ? "entry" : "entries"}</span>${journal.length && cap.downloads ? `<button class="btn" id="j-csv">Export CSV</button>` : ""}</header>
      ${jState === "loading" && cap.db ? `<p class="small mut">Loading entries…</p>` : jState === "error" ? `<p class="small mut">The journal could not load. Reload the page to try again.</p>` : !journal.length
        ? `<div class="empty"><b>No decisions logged yet.</b><span>Use the form above, or "Log a decision" from any instrument. Each entry records the call and exit level at the time, so the weekly review can score your decisions against the rules.</span></div>`
        : `<div class="tw"><table><thead><tr><th>Date</th><th>Instrument</th><th>Action</th><th class="n">Price</th><th class="n">Now</th><th class="n">Since</th><th class="n">Weight</th><th>Call then</th><th>Why</th><th>Review</th><th></th></tr></thead><tbody>
          ${journal.map(j => { const c = D.calls.find(x => x.symbol === j.symbol), now = live[j.symbol]?.price ?? c?.last, ch = now && j.price ? now / j.price - 1 : null;
            const good = ch == null ? null : ["Sell", "Trim", "Skip"].includes(j.action) ? -ch : ch;
            return `<tr><td class="mono small">${esc(j.date)}</td><td><b class="mono">${esc(j.symbol)}</b></td><td>${esc(j.action)}</td><td class="n">${px(j.price)}</td><td class="n">${px(now)}</td>
            <td class="n ${cls(good)}">${pct(ch)}</td><td class="n">${j.weight != null ? pct(j.weight, false, 2) : "—"}</td><td>${j.stance_at_entry ? stanceChip(j.stance_at_entry) : ""}</td>
            <td class="small" style="min-width:220px">${esc(j.reason)}</td><td class="mono small ${j.review_date && j.review_date <= today ? "neg" : ""}">${esc(j.review_date || "")}</td>
            <td>${canWrite ? `<button class="btn ghost small" data-del="${esc(j.id)}">Delete</button>` : ""}</td></tr>`; }).join("")}</tbody></table></div>
          <p class="note">"Since" is the move from your price to the latest price (live if priced, else this week's close), signed so that positive means the decision is working: a sale gains when the price falls.</p>`}
    </div>`;
  S.prefill = null;
  const f = $("#jf"); if (f) f.onsubmit = async ev => {
    ev.preventDefault();
    const sym = $("#j-sym").value, c = D.calls.find(x => x.symbol === sym), price = Number($("#j-px").value), w = $("#j-w").value.trim();
    if (!(price > 0)) { $("#j-msg").textContent = "Enter the price you dealt at (a positive number)."; return; }
    const why = $("#j-why").value.trim(); if (!why) { $("#j-msg").textContent = "Add the reason: it is what the review checks."; return; }
    const doc = {created: new Date().toISOString(), date: $("#j-date").value, symbol: sym, action: $("#j-act").value, price,
      weight: w ? Number(w) / 100 : null, reason: why.slice(0, 1500), review_date: $("#j-rev").value || null,
      stance_at_entry: c?.stance || null, exit_at_entry: c?.stop ?? null, buy_zone_at_entry: c?.entry || null, week: D.as_of};
    $("#j-save").disabled = true; $("#j-msg").textContent = "Saving…";
    try { await cap.db.collection("journal").add(doc); toast("Saved to journal"); }
    catch (e) {
      $("#j-save").disabled = false;
      $("#j-msg").textContent = e.code === "invalid_argument" ? "You do not have permission to add to this journal." : e.code === "quota_exceeded" ? "The journal is full. Delete old entries first." : "Not saved: the store did not answer. Try again.";
      if (e.code === "invalid_argument") cap.canWrite = false;
    }
  };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Confirm delete"; b.classList.add("primary"); setTimeout(() => { if (b.isConnected) { b.dataset.armed = ""; b.textContent = "Delete"; b.classList.remove("primary"); } }, 4000); return; }
    b.disabled = true;
    try { await cap.db.doc("journal/" + b.dataset.del).delete(); toast("Deleted"); } catch { b.disabled = false; toast("Not deleted. Try again."); }
  });
  const csv = $("#j-csv"); if (csv) csv.onclick = async () => {
    const cols = ["date", "symbol", "action", "price", "weight", "stance_at_entry", "exit_at_entry", "review_date", "reason", "week"];
    const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const text = [cols.join(","), ...journal.map(j => cols.map(k => q(j[k])).join(","))].join("\n");
    try { await cap.downloads.save({filename: `decision-journal-${today}.csv`, data: new Blob([text], {type: "text/csv"})}); }
    catch (e) { if (e.code !== "declined") toast("Export is not available here."); }
  };
}

window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (D && id !== S.tab && TABS.some(t => t.id === id)) show(id); });
boot();
</script>
