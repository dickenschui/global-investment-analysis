[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-investment-research"
version = "0.1.0"
description = "Multi-market monitor, portfolio and income research for HK, China, SG, UK and US"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.11"]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.50"]
test = ["pytest>=8"]

[project.scripts]
global-research = "global_investment_research.cli:main"

[tool.setuptools]
packages = ["global_investment_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
